<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khuangpuilam YMA Member Directory</title>
    
    <!-- External Frameworks & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800">

    <!-- ==================== LOGIN PAGE ==================== -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-blue-600">Khuangpuilam YMA</h1>
                <p class="text-slate-500 text-sm mt-1">Member Ziahluhna leh Enna</p>
            </div>
            
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden bg-red-50 p-2.5 rounded-lg border border-red-100"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-sm cursor-pointer">
                    Log In
                </button>
            </form>
        </div>
    </div>

    <!-- ==================== MAIN DASHBOARD ==================== -->
    <div id="dashboardPage" class="hidden">
        <!-- Navigation Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-10 px-6 py-4 flex justify-between items-center shadow-sm">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Khuangpuilam YMA Member Chhinchhiahna</h1>
                <span id="roleBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full mt-1 inline-block"></span>
            </div>
            <button id="logoutBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition duration-150 cursor-pointer">
                Logout
            </button>
        </header>

        <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
            
            <!-- SECTION 1: DATA ENTRY FORM -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span> Member Ziah Luhna
                </h2>
                
                <form id="dataEntryForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Section</label>
                        <select id="section" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="">Section Thlang Rawh</option>
                            <option value="Chawngbawla">Chawngbawla</option>
                            <option value="Vanapa">Vanapa</option>
                            <option value="Khuangchera">Khuangchera</option>
                            <option value="Taitesena">Taitesena</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Hming</label>
                        <input type="text" id="hming" required placeholder="Hming Pum Ziah Tur" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div class="col-span-1">
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Inlaichinna</label>
                            <select id="relation" required class="w-full px-2 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="S/o">S/o</option>
                                <option value="D/o">D/o</option>
                                <option value="H/o">H/o</option>
                                <option value="W/o">W/o</option>
                                <option value="C/o">C/o</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Chhungte Hming</label>
                            <input type="text" id="chhungte" required placeholder="Parent/Spouse Name" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Pian Kum</label>
                        <input type="date" id="pianKum" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Member Fee</label>
                        <select id="memberFee" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="Pe">Pe</option>
                            <option value="Pe Lo">Pe Lo</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Endowment Fund</label>
                        <select id="endowmentFund" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="Pe">Pe</option>
                            <option value="Pe Lo">Pe Lo</option>
                        </select>
                    </div>

                    <div class="md:col-span-2 lg:col-span-3 pt-2">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition duration-150 shadow-sm cursor-pointer">
                            Submit
                        </button>
                    </div>
                </form>
            </section>

            <!-- SECTION 2: DATA DISPLAY SECTION -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex flex-col lg:flex-row gap-4 justify-between items-start lg:items-center bg-slate-50/50">
                    <div>
                        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Member Enna
                        </h2>
                        <p id="tableViewStatus" class="text-xs text-slate-500 mt-0.5">Loading data directly from database...</p>
                    </div>
                    
                    <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                        <!-- Dropdown Filter for Section -->
                        <div class="w-full sm:w-44">
                            <select id="filterSection" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="">Section Zawng Zawng</option>
                                <option value="Chawngbawla">Chawngbawla</option>
                                <option value="Vanapa">Vanapa</option>
                                <option value="Khuangchera">Khuangchera</option>
                                <option value="Taitesena">Taitesena</option>
                            </select>
                        </div>

                        <!-- Search Box -->
                        <div class="relative flex-1 sm:flex-initial">
                            <input type="text" id="searchName" placeholder="Search Hming (Name)..." class="w-full sm:w-64 pl-4 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        </div>
                        
                        <div id="adminControls" class="hidden">
                            <button id="extractPdfBtn" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition duration-150 shadow-sm cursor-pointer">
                                Extract to PDF
                            </button>
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                                <th class="py-3 px-6">Section Awmna</th>
                                <th class="py-3 px-6">Hming Pum</th>
                                <th class="py-3 px-6">Chhungte </th>
                                <th class="py-3 px-6">Pian Kum </th>
                                <th class="py-3 px-6">Member Fee</th>
                                <th class="py-3 px-6">Endowment Fund</th>
                                <th id="thAction" class="py-3 px-6 text-right hidden">Action</th>
                            </tr>
                        </thead>
                        <tbody id="memberTableBody" class="divide-y divide-slate-100 text-sm text-slate-700">
                            <!-- Populated Dynamically via Javascript -->
                        </tbody>
                    </table>
                </div>

                <!-- NEW COMPONENT: Dynamic Pagination Control Footer Bar -->
                <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                    <div class="text-xs text-slate-500 font-medium">
                        Showing <span id="pageRangeText" class="font-semibold text-slate-700">0-0</span> of <span id="totalRecordsText" class="font-semibold text-slate-700">0</span> members
                    </div>
                    <div id="paginationButtons" class="flex items-center gap-1">
                        <!-- Dynamic page list targets will build here -->
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Custom Logic Module Script -->
    <script type="module" src="script.js"></script>
</body>
</html>
